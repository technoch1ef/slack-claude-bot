display_information:
  name: Claude
  description: Ask Claude anything by mentioning it in a channel
features:
  bot_user:
    display_name: Claude
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
settings:
  event_subscriptions:
    request_url: https://bakesy-slack-claude-bot-889638b7594d.herokuapp.com/slack/events
    bot_events:
      - app_mention
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
